name: rc-build

# Release-candidate binaries from a branch, without tagging and without
# merging.
#
# Deliberately NOT a tag push: release-please derives its baseline from tags, so
# an rc tag risks moving that baseline, and a tag would also cut a real GitHub
# release. These artifacts live on the workflow run and expire.
#
# workflow_dispatch only appears once this file is on the default branch, which
# is why the label trigger exists — pull_request workflows run from the head
# branch, so labelling an open PR builds that PR's code today.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (defaults to the selected ref)
        required: false
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  snapshot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'build-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
          # goreleaser derives the snapshot version from git history.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # --snapshot builds without a tag; --skip=publish keeps it off GitHub
      # Releases entirely, so nothing here can be mistaken for a real release.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish

      - name: what was built
        run: |
          echo "### RC build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist/*.tar.gz dist/checksums.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "These are unreleased snapshot builds. \`evac version\` reports the" >> "$GITHUB_STEP_SUMMARY"
          echo "snapshot string, not a release tag." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evac-rc-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 14
          if-no-files-found: error
