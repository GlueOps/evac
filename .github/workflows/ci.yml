name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # CI uses Go natively and calls the same make targets local development
      # runs in a container, so the two cannot drift.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: vet
        run: make vet

      # The race detector matters here: the recorder fans events out to a
      # single writer goroutine while drain workers run concurrently.
      - name: test
        run: make test

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      # Integration tests must not be silently broken by a refactor just
      # because the tag keeps them out of the normal build.
      - name: vet integration tests
        run: go vet -tags integration ./test/...

      # goreleaser ships darwin/arm64, so a build that only ever happens at
      # release time is a build nobody has tested.
      - name: cross-compile the release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/evac
          done

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # A tool that deletes data should not be shipping a known-vulnerable
      # client-go. This reports only vulnerabilities actually reachable from
      # this code, so it is not the usual dependency-scanner noise.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
